name: Build Base64E OpenBOR APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Checkout OpenBOR
        uses: actions/checkout@v4
        with:
          repository: DCurrent/openbor
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download game PAK from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p assets

          gdown "1cxVmYH6uGaXtSqcde4RffvIkmcWddsiB" \
            -O assets/base64e-game.pak \
            --retries 5 \
            --timeout 120 || {
              echo "::error::gdown failed. Make sure the Drive file is publicly accessible (Anyone with the link)."
              exit 1
            }

          if [ ! -s assets/base64e-game.pak ]; then
            echo "::error::Game PAK is empty"
            exit 1
          fi

          ls -lh assets/base64e-game.pak
          file assets/base64e-game.pak

          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/base64e-game.pak")
          with p.open("rb") as f:
              header = f.read(8)
          if len(header) != 8 or header[:4] != b"PACK":
              raise SystemExit(f"Bad PAK header: {header!r}")
          format_id = int.from_bytes(header[4:8], "little")
          if format_id not in (0, 1):
              raise SystemExit(f"Unsupported format ID: {format_id}")
          print(f"PAK OK, format ID = {format_id}")
          PY

      - name: Apply Base64E changes
        run: python3 scripts/patch_upstream.py

      - name: Configure package name + version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="upstream/engine/android/app/build.gradle"
          test -f "$GRADLE_FILE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("upstream/engine/android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # applicationId
          s, c1 = re.subn(
              r'(?m)^(\s*applicationId\s+)"[^"]+"',
              r'\1"kz.base64e.openbor1"',
              s, count=1
          )
          if c1 != 1:
              raise SystemExit("Could not update applicationId")

          # versionName (OpenBOR expects 1.0.0.pak when this is set)
          if 'versionName "1.0.0"' not in s:
              s = re.sub(
                  r'(?m)^(\s*versionName\s+)"[^"]+"',
                  r'\1"1.0.0"',
                  s, count=1
              )

          p.write_text(s, encoding="utf-8")
          print("applicationId = kz.base64e.openbor1")
          print("versionName   = 1.0.0")
          PY

          grep -nE 'applicationId|namespace|versionName|versionCode' "$GRADLE_FILE"

      - name: Bundle game PAK as 1.0.0.pak
        shell: bash
        run: |
          set -euo pipefail
          DEST="upstream/engine/android/app/src/main/assets"
          mkdir -p "$DEST"
          # OpenBOR standalone mode expects exactly versionName.pak
          cp assets/base64e-game.pak "$DEST/1.0.0.pak"
          ls -lh "$DEST/1.0.0.pak"
          test -s "$DEST/1.0.0.pak"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/engine/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Generate version
        working-directory: upstream/engine
        run: bash version.sh

      - name: Build Debug APK
        working-directory: upstream/engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Base64E-Debug
          path: upstream/engine/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- Release signing (optional) ----------
      - name: Decode keystore (if secrets exist)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
          ls -l /tmp/release.keystore

      - name: Build Signed Release APK
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        working-directory: upstream/engine/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key0' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          # Create a simple signing config via gradle properties
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=/tmp/release.keystore
          RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_ALIAS=${KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

          # Minimal patch to enable signing (if not already present)
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          if "signingConfigs" not in s:
              # very simple injection – works for most OpenBOR gradle files
              inject = '''
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RELEASE_STORE_FILE") ?: "/tmp/release.keystore")
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "key0"
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''
              # We just force assembleRelease with the env vars
              print("Signing config will be applied via env")
          p.write_text(s, encoding="utf-8")
          PY

          ./gradlew --no-daemon assembleRelease || ./gradlew --no-daemon assembleDebug

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Base64E-Release
          path: |
            upstream/engine/android/app/build/outputs/apk/release/*.apk
            upstream/engine/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn