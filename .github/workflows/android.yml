name: Build Base64E OpenBOR APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Checkout OpenBOR
        uses: actions/checkout@v4
        with:
          repository: DCurrent/openbor
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Base64E changes
        run: python3 scripts/patch_upstream.py

      - name: Configure package name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("upstream/engine/android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s, c = re.subn(r'(?m)^(\s*applicationId\s+)"[^"]+"', r'\1"kz.base64e.openbor1"', s, count=1)
          if c != 1:
              raise SystemExit("applicationId update failed")
          if 'versionName "1.0.0"' not in s:
              s = re.sub(r'(?m)^(\s*versionName\s+)"[^"]+"', r'\1"1.0.0"', s, count=1)
          p.write_text(s, encoding="utf-8")
          print("applicationId = kz.base64e.openbor1")
          PY
          grep -nE 'applicationId|versionName' upstream/engine/android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/engine/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android command-line tools not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager closes stdin after all licenses are accepted; "yes" then
          # exits with SIGPIPE, so do not let pipefail treat that as a failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Generate version
        working-directory: upstream/engine
        run: bash version.sh

      - name: Verify
        run: |
          grep -q 'applicationId "kz.base64e.openbor1"' upstream/engine/android/app/build.gradle
          test -f upstream/engine/android/app/src/main/java/org/openbor/engine/LauncherActivity.java
          test -f upstream/engine/android/app/src/main/java/org/openbor/engine/GameActivity.java
          test ! -f upstream/engine/android/app/src/main/assets/base64e-game.pak
          echo "Native OpenBOR launcher and touch editor checks OK"

      - name: Build Debug APK
        working-directory: upstream/engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Base64E-Debug
          path: upstream/engine/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- Signing (тек KEYSTORE_B64 + KEYSTORE_PASSWORD бар болса) ----------
      - name: Prepare keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No KEYSTORE_B64 — skipping release signing"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          ls -l /tmp/release.keystore
          echo "has_keystore=true" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: upstream/engine/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Alias-ты автоматты түрде табуға тырысамыз
          # Көптеген keystore-да alias = key0 немесе exported_key болады
          PASS="$KEYSTORE_PASSWORD"

          # Алдымен key0 деп көреміз
          cat > gradle.properties <<EOF
          android.injected.signing.store.file=/tmp/release.keystore
          android.injected.signing.store.password=$PASS
          android.injected.signing.key.alias=key0
          android.injected.signing.key.password=$PASS
          EOF

          if ./gradlew --no-daemon assembleRelease; then
            echo "Signed with alias=key0"
          else
            echo "key0 failed, trying exported_key..."
            cat > gradle.properties <<EOF
          android.injected.signing.store.file=/tmp/release.keystore
          android.injected.signing.store.password=$PASS
          android.injected.signing.key.alias=exported_key
          android.injected.signing.key.password=$PASS
          EOF
            ./gradlew --no-daemon assembleRelease || true
          fi

          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Base64E-Release
          path: upstream/engine/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn